<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="394" viewBox="0 0 1200 394" role="img" aria-label="Environment variables: GEMINI_API_KEY, GEMINI_MODEL, DJANGO_SECRET_KEY, DJANGO_DEBUG, DJANGO_ALLOWED_HOSTS">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="393" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="48" y="66" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#8e8e93">.env</text><text x="48" y="119" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f5f5f7">GEMINI_API_KEY</text><text x="470" y="119" font-size="19" font-weight="500" fill="#86868b">without it the calculator works, but offers do not</text><rect x="1066" y="96" width="86" height="32" rx="16" fill="#bf5af2" fill-opacity="0.16"/><text x="1109.1" y="118" font-size="16" font-weight="600" fill="#bf5af2" text-anchor="middle">for offers</text><line x1="48" y1="138" x2="1152" y2="138" stroke="#ffffff" stroke-opacity="0.07"/><text x="48" y="173" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f5f5f7">GEMINI_MODEL</text><text x="470" y="173" font-size="19" font-weight="500" fill="#86868b">default: gemini-3.5-flash</text><line x1="48" y1="192" x2="1152" y2="192" stroke="#ffffff" stroke-opacity="0.07"/><text x="48" y="227" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f5f5f7">DJANGO_SECRET_KEY</text><text x="470" y="227" font-size="19" font-weight="500" fill="#86868b">required when DJANGO_DEBUG=0</text><rect x="1039" y="204" width="113" height="32" rx="16" fill="#ff9f0a" fill-opacity="0.16"/><text x="1095.7" y="226" font-size="16" font-weight="600" fill="#ff9f0a" text-anchor="middle">for production</text><line x1="48" y1="246" x2="1152" y2="246" stroke="#ffffff" stroke-opacity="0.07"/><text x="48" y="281" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f5f5f7">DJANGO_DEBUG</text><text x="470" y="281" font-size="19" font-weight="500" fill="#86868b">default 1, use 0 in production</text><line x1="48" y1="300" x2="1152" y2="300" stroke="#ffffff" stroke-opacity="0.07"/><text x="48" y="335" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f5f5f7">DJANGO_ALLOWED_HOSTS</text><text x="470" y="335" font-size="19" font-weight="500" fill="#86868b">domains, separated by commas</text><rect x="1039" y="312" width="113" height="32" rx="16" fill="#ff9f0a" fill-opacity="0.16"/><text x="1095.7" y="334" font-size="16" font-weight="600" fill="#ff9f0a" text-anchor="middle">for production</text>
</g>
</svg>
