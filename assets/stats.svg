<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Один STL-файл, чтобы получить цену. Три технологии: FDM, SLA, SLM. Django 6 и Python 3.12. ИИ пишет описание и коммерческое предложение.">
